# =============================================================================
# PLUTO vProctor — Coturn STUN/TURN Server Staging Configuration
# Target Host: Ubuntu 22.04 LTS (Option A: Single EC2 g4dn.xlarge)
# File Location on Host: /etc/turnserver.conf
# =============================================================================

# Network Binding & Listening Ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Ephemeral Media Relay UDP Port Range
# Restricts open firewall surface to 41 UDP ports (49160 to 49200)
# Port Math: 41 ports / 2 ports per bidirectional stream = 20 concurrent streams maximum.
# IMPORTANT: 20 concurrent streams is a theoretical maximum based on port math.
# Real-world capacity must be empirically validated under network jitter and CPU load.
min-port=49160
max-port=49200

# Public IP Assignment (Must match AWS Elastic IP of staging EC2 instance)
# Replace with actual EC2 Public IPv4 address upon provisioning:
# external-ip=YOUR_STAGING_PUBLIC_IP

# Server Realm & Domain
realm=staging.yourdomain.com
server-name=staging.yourdomain.com

# Authentication Mechanism
# Codebase compatibility: transport_adapter.py supplies static TURN_USERNAME and TURN_CREDENTIAL
# Therefore, use Long-Term Credential Mechanism (lt-cred-mech) with static credentials or database
lt-cred-mech
user=pluto_staging_user:REPLACE_WITH_TURN_SECRET

# TLS / DTLS Certificates (for TURNS on port 5349)
cert=/etc/letsencrypt/live/staging.yourdomain.com/fullchain.pem
pkey=/etc/letsencrypt/live/staging.yourdomain.com/privkey.pem

# Security & Anti-Abuse Hardening
fingerprint
no-loopback-peers
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Logging & Operational Metrics
verbose
log-file=/var/log/turnserver/turnserver.log
simple-log
