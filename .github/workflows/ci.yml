name: PLUTO vProctor CI Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test-gate:
    name: Backend Unit, Proctoring & Monotonic Scoring Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install alembic pytest

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest backend/tests/ -v

      - name: Run Ground-Truth Fixture Evaluation Gate
        run: |
          python backend/scripts/evaluate_fixtures.py --gate-check

  postgres-migration-gate:
    name: Fresh PostgreSQL Alembic Migration Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pluto_user
          POSTGRES_PASSWORD: pluto_password
          POSTGRES_DB: pluto_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Migration & PG Driver Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install alembic psycopg2-binary pytest

      - name: Run Alembic Upgrade on Fresh PostgreSQL Database
        env:
          DATABASE_URL: postgresql://pluto_user:pluto_password@localhost:5432/pluto_db
          ALEMBIC_DATABASE_URL: postgresql://pluto_user:pluto_password@localhost:5432/pluto_db
          TEST_POSTGRES_URL: postgresql://pluto_user:pluto_password@localhost:5432/pluto_db
        run: |
          alembic upgrade head
          alembic check
          python -m pytest backend/tests/test_migrations.py -v

  frontend-build-gate:
    name: Frontend Lint, Unit Tests & Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend && npm ci

      - name: Run Frontend Lint (oxlint)
        run: |
          npm --prefix frontend run lint

      - name: Run Frontend Unit Tests
        run: |
          node --test frontend/tests/*.js

      - name: Build Vite Production Bundle
        run: |
          npm --prefix frontend run build

