name: PLUTO vProctor CI Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test-gate:
    name: Backend Unit, Proctoring & Monotonic Scoring Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install alembic pytest

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest backend/tests/ -v

      - name: Run Ground-Truth Fixture Evaluation Gate
        run: |
          python backend/scripts/evaluate_fixtures.py --gate-check

  frontend-build-gate:
    name: Frontend Build & FSM Regression Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend && npm ci

      - name: Run FSM Unit Tests
        run: |
          node --test frontend/tests/test_interview_fsm.js

      - name: Build Vite Production Bundle
        run: |
          npm --prefix frontend run build

